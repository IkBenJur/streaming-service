<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streaming Service</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 720px;
    }

    input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: monospace;
    }

    input::placeholder { color: #555; }

    button {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button:hover { background: #2563eb; }

    video {
      width: 100%;
      max-width: 720px;
      border-radius: 8px;
      background: #000;
    }

    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #888;
      max-width: 720px;
      width: 100%;
    }

    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <h1>Streaming Service</h1>

  <div class="controls">
    <input id="videoId" type="text" placeholder="Video UUID (e.g. 0f8548e4-5631-49b6-9cdb-7d2ac5b94f8e)" />
    <button onclick="loadVideo()">Play</button>
  </div>

  <video id="player" controls></video>
  <p id="status"></p>

  <script>
    const BACKEND_URL = '${BACKEND_URL}';

    let hls = null;

    function createSignedLoader(videoId) {
      return class SignedLoader {
        constructor(config) {
          this.controller = null;
          this.stats = {
            aborted: false, loaded: 0, retry: 0, total: 0, chunkCount: 0, bwEstimate: 0,
            loading: { start: 0, first: 0, end: 0 },
            parsing: { start: 0, end: 0 },
            buffering: { start: 0, first: 0, end: 0 },
          };
        }

        async load(context, config, callbacks) {
          this.stats.loading.start = performance.now();
          this.controller = new AbortController();
          const signal = this.controller.signal;

          try {
            const filename = context.url.split('/').pop().split('?')[0];
            const sigRes = await fetch(`${BACKEND_URL}/videos/${videoId}/stream/${filename}/signed-url`, { signal });
            if (!sigRes.ok) throw new Error(`signing endpoint returned ${sigRes.status}`);
            const { signed_url } = await sigRes.json();

            const res = await fetch(signed_url, { signal });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = context.responseType === 'arraybuffer'
              ? await res.arrayBuffer()
              : await res.text();

            const t = performance.now();
            this.stats.loading.first = t;
            this.stats.loading.end = t;
            this.stats.loaded = this.stats.total = data.byteLength ?? data.length;

            callbacks.onSuccess({ data, url: signed_url }, this.stats, context, null);
          } catch (err) {
            if (err.name !== 'AbortError') {
              callbacks.onError({ code: 0, text: err.message }, context, null, this.stats);
            }
          }
        }

        abort() { this.controller?.abort(); }
        destroy() { this.controller?.abort(); }
      };
    }

    function loadVideo() {
      const id = document.getElementById('videoId').value.trim();
      const video = document.getElementById('player');

      if (!id) {
        setStatus('Enter a video UUID.', true);
        return;
      }

      setStatus('Loading…');
      if (hls) { hls.destroy(); hls = null; }

      if (Hls.isSupported()) {
        hls = new Hls({ loader: createSignedLoader(id) });
        hls.loadSource(`${BACKEND_URL}/videos/${id}/stream/playlist.m3u8`);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { setStatus(''); video.play(); });
        hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) setStatus(`Error: ${data.details}`, true); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        fetch(`${BACKEND_URL}/videos/${id}/stream/playlist.m3u8/signed-url`)
          .then(r => r.json())
          .then(({ signed_url }) => {
            video.src = signed_url;
            video.addEventListener('loadedmetadata', () => { setStatus(''); video.play(); }, { once: true });
            video.addEventListener('error', () => setStatus('Playback error.', true), { once: true });
          })
          .catch(err => setStatus(`Error: ${err.message}`, true));
      } else {
        setStatus('HLS is not supported in this browser.', true);
      }
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = isError ? 'error' : '';
    }

    document.getElementById('videoId').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadVideo();
    });
  </script>
</body>
</html>
